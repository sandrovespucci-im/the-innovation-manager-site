<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The I'm — Logo Dark</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #1C1E2A; display: flex; align-items: center; justify-content: center; }
  .logo { display: flex; flex-direction: column; align-items: flex-start; padding: 70px; }
  .top { font-family: 'Space Mono', monospace; font-size: 16px; letter-spacing: 6px; color: #7A7F9A; margin-bottom: 10px; text-transform: uppercase; }
  .main { display: flex; align-items: baseline; }
  .i, .m { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 130px; color: #F2EEE7; line-height: 1; }
  .apos { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 130px; color: #C8A96A; margin: 0 6px; }
  .line { width: 60px; height: 2px; background: #C8A96A; margin: 20px 0 10px 0; }
  .tagline { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 3px; color: #6B708A; text-transform: uppercase; }
  .tagline strong { color: #BFC3D9; }
  .dots { color: #C8A96A; }
</style>
</head>
<body>
<div class="logo">
  <div class="top">THE</div>
  <div class="main">
    <div class="i">I</div><div class="apos">'</div><div class="m">m</div>
  </div>
  <div class="line"></div>
  <div class="tagline">
    <strong>INNOVATION MANAGER</strong>
    <span class="dots"> •</span> DATA
    <span class="dots"> •</span> AI
    <span class="dots"> •</span> PROCESS
  </div>
</div>
</body>
</html>
